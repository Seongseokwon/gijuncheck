<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>기준체크</title>

  <!-- 기준체크의 헤더 심볼을 16px에서도 읽히는 단순한 형태로 확장 -->
  <rect width="64" height="64" rx="16" fill="#102a43" />

  <!-- 위에서 내려오는 기준 -->
  <path
    d="M14 14h36v11H31v25H14z"
    fill="#f4f8fa"
  />

  <!-- 아래에서 올라오는 체크 결과 -->
  <path
    d="M50 50H14V39h19V14h17z"
    fill="#0c8f9d"
  />

  <!-- 두 기준이 맞물리는 중심부를 선명하게 유지 -->
  <path d="M31 25h2v14h-2z" fill="#102a43" />
</svg>
